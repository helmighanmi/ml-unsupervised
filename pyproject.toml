# Path: pyproject.toml
# Author: GHANMI Helmi
# Current Role: AI Engineer
# Past Role: Researcher in Applied Mathematics
# Research Profile: https://www.researchgate.net/profile/Ghanmi-Helmi

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-unsupervised"
version = "1.0.0"
description = "Production-oriented toolkit for clustering, dimensionality reduction, anomaly detection, and text-feedback clustering."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "GHANMI Helmi" }]
keywords = ["machine-learning", "unsupervised-learning", "clustering", "anomaly-detection", "dimensionality-reduction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "plotly>=5.22,<7",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
  "hdbscan>=0.8.38,<0.9",
  "umap-learn>=0.5.6,<0.6",
]

[project.optional-dependencies]
ui = [
  "openpyxl>=3.1,<4",
  "streamlit>=1.40,<2",
]
nlp = [
  "sentence-transformers>=3,<7",
]
notebooks = [
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[project.scripts]
ml-unsupervised = "ml_unsupervised.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
packages = ["ml_unsupervised"]

[tool.coverage.run]
source = ["ml_unsupervised"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
