name: Security

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade packaging and security tools
        run: |
          python -m pip install --upgrade \
            "pip>=26.2" \
            "setuptools>=83" \
            wheel \
            pip-audit

      - name: Show security tool versions
        run: |
          python --version
          python -m pip --version
          python -c "import setuptools; print('setuptools:', setuptools.__version__)"
          python -m pip_audit --version

      - name: Audit project dependencies
        run: |
          python -m pip_audit .

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v4